<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Comparar números romanos</title>
  <style>
    #compare-game {
      max-width: 520px;
      margin: 28px auto;
      padding: 18px;
      border-radius: 12px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.08);
      background: linear-gradient(180deg, #fff, #fbfbff);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
      text-align: center;
      position: relative;
    }
    #compare-game h2 { margin: 0 0 10px; font-size: 1.1rem; color:#333; }
    .numbers-row {
      display:flex;
      align-items:center;
      justify-content:center;
      gap: 18px;
      margin: 14px 0 8px;
      font-size: 2rem;
      font-weight: 700;
    }
    .num-box {
      min-width:110px;
      padding: 12px 10px;
      border-radius: 10px;
      background: linear-gradient(180deg,#f6f8ff,#eef2ff);
      box-shadow: inset 0 -3px 6px rgba(0,0,0,0.03);
      border: 2px solid transparent;
    }
    .sym {
      font-size: 2.6rem;
      width: 72px;
      display:flex;
      align-items:center;
      justify-content:center;
    }
    body {
      font-family: "Segoe UI", sans-serif;
      background: #f0f7ff;
      color: #222;
      padding: 20px;
      max-width: 600px;
      margin: auto;
      text-align: center;
    }
    h1 { color: #3366cc; margin-bottom: 10px; }
    input, button { padding: 8px; font-size: 16px; margin-top: 10px; }
    .controls { margin-top: 12px; display:flex; gap:10px; justify-content:center; }
    .controls button {
      padding: 10px 14px;
      font-size: 1.05rem;
      border-radius: 10px;
      border: none;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0,0,0,0.08);
      background: linear-gradient(180deg,#ffffff,#e9f0ff);
      transition: transform .12s ease, box-shadow .12s;
    }
    .controls button:active {
      transform: translateY(2px);
      box-shadow: 0 2px 6px rgba(0,0,0,0.06);
    }
    #feedback {
      min-height: 38px;
      margin-top: 14px;
      font-weight: 600;
      color: #222;
      display:flex;
      align-items:center;
      justify-content:center;
      gap:10px;
      padding:6px;
      border-radius:8px;
      background: #f5f5f5;
      transition: background 0.3s, border 0.3s;
    }
    .correct {
      animation: pop .45s ease;
      border: 2px solid #4ade80;
      background: linear-gradient(90deg,#f0fff4,#eaffef);
    }
    @keyframes pop {
      0% { transform: scale(.92); opacity: .6; }
      60% { transform: scale(1.06); opacity: 1; }
      100% { transform: scale(1); }
    }
    .wrong {
      animation: shake .6s;
      border: 2px solid #ff7b7b;
      background: linear-gradient(90deg,#fff6f6,#fff0f0);
    }
    @keyframes shake {
      0% { transform: translateX(0); }
      20% { transform: translateX(-6px); }
      40% { transform: translateX(6px); }
      60% { transform: translateX(-4px); }
      80% { transform: translateX(4px); }
      100% { transform: translateX(0); }
    }
    .confetti {
      pointer-events: none;
      position: absolute;
      font-size: 22px;
      opacity: 1;
      transform-origin: center;
      animation: floatUp 1100ms linear forwards;
      will-change: transform, opacity;
    }
    @keyframes floatUp {
      0% { transform: translateY(0) rotate(0deg) scale(1); opacity: 1; }
      100% { transform: translateY(-140px) rotate(360deg) scale(.7); opacity: 0; }
    }
    .bottom-row {
      margin-top: 12px;
      display:flex;
      justify-content:center;
      gap:10px;
      align-items:center;
      flex-wrap: wrap;
    }
    .btn-secondary {
      background: linear-gradient(180deg,#ffffff,#f3f4f6);
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 0.95rem;
    }
    #score { font-weight: 600; margin: 12px 0; }
    @media (max-width:420px){
      .numbers-row { gap: 10px; }
      .num-box { min-width:80px; padding:10px; font-size:1.4rem; }
      .sym { width:56px; font-size:2.2rem; }
    }
  </style>
</head>
<body>
  <h1>CLASE DEL CID CAMPEADOR</h1>
  <p>
    <a href="index.html" style="text-decoration:none; background:#3366cc; color:white; padding:8px 14px; border-radius:6px;">
      ➡ Volver a descomponer números
    </a>
  </p>

  <div id="compare-game" aria-live="polite">
    <h2>Comparar números romanos — ¿qué símbolo corresponde?</h2>
    <div id="score">Puntos: 0</div>

    <div class="numbers-row" id="numbersRow">
      <div class="num-box" id="leftNum" aria-label="Número izquierdo">I</div>
      <div class="sym" id="midSymbol">?</div>
      <div class="num-box" id="rightNum" aria-label="Número derecho">I</div>
    </div>

    <div class="controls" role="group" aria-label="Elige el símbolo">
      <button data-op="lt" title="Menor que">&lt;</button>
      <button data-op="gt" title="Mayor que">&gt;</button>
      <button data-op="eq" title="Igual">=</button>
    </div>

    <div id="feedback" aria-atomic="true"></div>

    <div class="bottom-row">
      <button class="btn-secondary" id="revealLeft">Ayuda izquierda</button>
      <button class="btn-secondary" id="revealRight">Ayuda derecha</button>
      <button class="btn-secondary" id="newBtn">Otro número</button>
    </div>
  </div>

  <script>
  (function(){
    const leftEl = document.getElementById('leftNum');
    const rightEl = document.getElementById('rightNum');
    const midSym = document.getElementById('midSymbol');
    const feedback = document.getElementById('feedback');
    const controls = document.querySelectorAll('#compare-game .controls button');
    const newBtn = document.getElementById('newBtn');
    const revealLeft = document.getElementById('revealLeft');
    const revealRight = document.getElementById('revealRight');
    const container = document.getElementById('compare-game');
    const scoreEl = document.getElementById('score');

    const niceFails = [
      "¡Casi! No pasa nada, inténtalo otra vez 💪",
      "Has estado cerca. ¡Tú puedes! ✨",
      "Cada fallo enseña — ¡sigue así! 📚",
      "Ups — prueba otra vez, estás aprendiendo 🌱",
      "Sigue intentándolo — ¡eres valiente! 🚀"
    ];
    const winMsgs = [
      "¡Perfecto! 🎉",
      "¡Muy bien! ¡Excelente trabajo! 🌟",
      "¡Has acertado! ¡Eres un crack! 💪",
      "¡Bien hecho! Sigue así ✨"
    ];

    let leftNum = 0, rightNum = 0;
    let wrongTimeout = null;
    let score = 0;
    let leftRevealed = false, rightRevealed = false;

    function randInt(min, max) { return Math.floor(Math.random()*(max-min+1))+min; }

    function toRoman(num){
      const romanMap = [["M",1000],["CM",900],["D",500],["CD",400],
                        ["C",100],["XC",90],["L",50],["XL",40],
                        ["X",10],["IX",9],["V",5],["IV",4],["I",1]];
      let res=''; for(const [r,v] of romanMap){while(num>=v){res+=r;num-=v;}} return res;
    }

    function updateScore(points){ score+=points; scoreEl.textContent=`Puntos: ${score}`; }

    function newRound(){
  if(wrongTimeout){ clearTimeout(wrongTimeout); wrongTimeout=null; }

  // Generar números aleatorios
  leftNum = randInt(1,3999);
  rightNum = randInt(1,3999);

  // Mostrar números romanos
  leftEl.textContent = toRoman(leftNum);
  rightEl.textContent = toRoman(rightNum);

  // Reset de símbolos y feedback
  midSym.textContent = '?';
  feedback.textContent='';
  feedback.classList.remove('correct','wrong');
  leftEl.classList.remove('correct','wrong');
  rightEl.classList.remove('correct','wrong');

  // Limpiar confetti
  container.querySelectorAll('.confetti').forEach(n=>n.remove());

  // Reset de ayudas
  leftRevealed = rightRevealed = false;
}


    function checkAnswer(op){
      const correctOp = (leftNum<rightNum)?'lt':(leftNum>rightNum)?'gt':'eq';
      let points=5;
      if(leftRevealed) points-=2;
      if(rightRevealed) points-=2;

      if(op===correctOp){
        midSym.textContent = (correctOp==='lt')?'<':(correctOp==='gt')?'>':'=';
        feedback.textContent=winMsgs[Math.floor(Math.random()*winMsgs.length)];
        feedback.classList.remove('wrong'); feedback.classList.add('correct');
        leftEl.classList.remove('wrong'); rightEl.classList.remove('wrong');
        leftEl.classList.add('correct'); rightEl.classList.add('correct');
        launchConfetti();
        updateScore(points);
      }else{
        midSym.textContent=(op==='lt')?'<':(op==='gt')?'>':'=';
        feedback.textContent=niceFails[Math.floor(Math.random()*niceFails.length)];
        feedback.classList.remove('correct'); feedback.classList.add('wrong');
        leftEl.classList.remove('correct'); rightEl.classList.remove('correct');
        leftEl.classList.add('wrong'); rightEl.classList.add('wrong');
      }
      leftRevealed=false; rightRevealed=false;
    }

    controls.forEach(btn=>{ btn.addEventListener('click',()=>checkAnswer(btn.getAttribute('data-op'))); });
    newBtn.addEventListener('click', newRound);

    revealLeft.addEventListener('click', ()=>{
      if(!leftRevealed){ leftEl.textContent=leftNum; leftRevealed=true; updateScore(-2);
        //setTimeout(()=>leftEl.textContent=toRoman(leftNum),2000);
      }
    });
    revealRight.addEventListener('click', ()=>{
      if(!rightRevealed){ rightEl.textContent=rightNum; rightRevealed=true; updateScore(-2);
        //setTimeout(()=>rightEl.textContent=toRoman(rightNum),2000);
      }
    });

    function launchConfetti(){
      const emojis=['🎉','✨','🎈','💫','⭐','👍'];
      const rect=container.getBoundingClientRect();
      for(let i=0;i<12;i++){
        const s=document.createElement('span'); s.className='confetti';
        s.textContent=emojis[Math.floor(Math.random()*emojis.length)];
        const x=(rect.width/2)+(Math.random()*120-60);
        s.style.left=x+'px'; s.style.top=(rect.height*0.45)+'px';
        s.style.opacity=1; s.style.transform=`translateX(${Math.random()*40-20}px)`;
        s.style.fontSize=(16+Math.random()*18)+'px';
        s.style.position='absolute';
        s.style.animationDuration=(900+Math.random()*700)+'ms';
        container.appendChild(s);
        setTimeout(()=>s.remove(),1900);
      }
    }

    newRound();
  })();
  </script>
</body>
</html>
